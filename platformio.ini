[platformio]
default_envs = cyd4_hardware_test

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
upload_speed = 115200
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=1
    -D TOUCH_CS=33
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=20000000
    -D SPI_READ_FREQUENCY=10000000
    -D SPI_TOUCH_FREQUENCY=2500000

[env:cyd4_hardware_test]
build_flags = ${env.build_flags} -D SPECTER_HARDWARE_TEST=1

[env:cyd4_pet]
